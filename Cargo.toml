[workspace]

[package]
name = "mcp-medical"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Clinical reference and global health intelligence MCP server — PubMed, WHO GHO, health statistics, medical literature"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-medical"
keywords = ["mcp", "medical", "pubmed", "who", "health"]
categories = ["science", "api-bindings"]

[features]
default = ["pubmed", "who-gho"]
pubmed = []
who-gho = []
all-backends = ["pubmed", "who-gho"]

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
