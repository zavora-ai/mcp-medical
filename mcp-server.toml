server_id = "mcp_medical"
display_name = "Medical"
version = "1.0.1"
domain = "medical"
sdk_version = "0.2.0"
risk_level = "low"
writes_allowed = "none"
transports = ["stdio"]
credentials = []
governance_gates = []
environments = ["development", "staging", "production"]

[[tools]]
name = "pubmed_search"
description = "Search PubMed for medical literature by topic, condition, or treatment"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "pubmed_get_abstract"
description = "Get the abstract of a PubMed article by PMID"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "who_get_indicator"
description = "Get a specific WHO health indicator for a country (e.g. life expectancy, maternal mortality)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "who_country_profile"
description = "Get a comprehensive health profile for a country (life expectancy, mortality, disease prevalence, workforce)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "who_compare_countries"
description = "Compare a health indicator across multiple countries"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "who_search_indicators"
description = "Search available WHO health indicators by keyword"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "who_list_common_indicators"
description = "List common WHO health indicator codes and their descriptions"
risk_class = "read_only"
requires_approval = false
credential_bindings = []
